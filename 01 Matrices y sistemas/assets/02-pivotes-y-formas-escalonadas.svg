<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Pivotes, forma escalonada y forma reducida</title><desc id="desc">La matriz escalonada de filas (2,4,0), (0,3,6) y (0,0,0) tiene pivotes en las columnas 1 y 2. Su forma reducida tiene filas (1,0,−4), (0,1,2) y (0,0,0).</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker></defs><rect width="1000" height="390" fill="#ffffff"/><text x="40" y="48" class="title">Pivotes, forma escalonada y forma reducida</text><rect x="45" y="92" width="425" height="205" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="61" y="120" class="label">REF · escalonada</text><rect x="530" y="92" width="425" height="205" rx="14" fill="#ecfeff" stroke="#64748b" stroke-width="2"/><text x="546" y="120" class="label">RREF · escalonada reducida</text><text x="82" y="153" class="body">[ 2  4  0 ]</text><text x="82" y="201" class="body">[ 0  3  6 ]</text><text x="82" y="249" class="body">[ 0  0  0 ]</text><text x="570" y="153" class="body">[ 1  0  −4 ]</text><text x="570" y="201" class="body">[ 0  1   2 ]</text><text x="570" y="249" class="body">[ 0  0   0 ]</text><text x="72" y="278" class="body">Pivotes en col. 1 y 2</text><text x="560" y="278" class="body">Pivotes 1, únicos por columna</text><text x="55" y="340" class="body">Las matrices son equivalentes; las filas nulas quedan abajo.</text><style>.title{font:700 23px system-ui,sans-serif;fill:#0f172a}.label{font:600 15px system-ui,sans-serif;fill:#334155}.body{font:19px ui-monospace,SFMono-Regular,monospace;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#0f766e}</style></svg>