<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">Gauss–Jordan aplicado a [A|I]</title><desc id="desc">Las mismas operaciones elementales por filas multiplican A y la identidad desde la izquierda. Si el producto Q A llega a I, entonces Q A = I y, para matrices cuadradas, Q es la inversa bilateral de A. El bloque derecho registra Q.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:18px}.math{font-family:Georgia,serif;font-size:21px}.small{font-size:16px}.panel{fill:#f8fafc;stroke:#64748b;stroke-width:2}.blue{fill:#eff6ff}.teal{fill:#ecfeff}.amber{fill:#fff7ed}.edge{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrow)}.divider{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}.note{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5}.bad{fill:#fff1f2;stroke:#e11d48;stroke-width:2}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker></defs><rect width="1100" height="480" fill="#ffffff"/><text x="38" y="48" class="title">Gauss–Jordan: las operaciones actúan sobre ambos bloques</text>
<rect x="35" y="90" width="300" height="190" rx="15" class="panel blue"/><text x="58" y="128" class="head">Inicio</text><text x="65" y="190" class="math">[ A | I<tspan baseline-shift="sub" font-size="70%">n</tspan> ]</text><text x="58" y="238" class="small">Matriz y matriz identidad</text>
<path d="M355 185 L445 185" class="edge"/><text x="365" y="158" class="small">E<tspan baseline-shift="sub" font-size="70%">1</tspan>, E<tspan baseline-shift="sub" font-size="70%">2</tspan>, ..., E<tspan baseline-shift="sub" font-size="70%">p</tspan></text>
<rect x="465" y="90" width="280" height="190" rx="15" class="panel teal"/><text x="488" y="128" class="head">Tras operar</text><text x="495" y="190" class="math">[ QA | Q ]</text><text x="488" y="238" class="small">Q = E<tspan baseline-shift="sub" font-size="70%">p</tspan> ... E<tspan baseline-shift="sub" font-size="70%">2</tspan>E<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<path d="M765 185 L855 185" class="edge"/><text x="777" y="158" class="small">si QA = I<tspan baseline-shift="sub" font-size="70%">n</tspan></text>
<rect x="875" y="90" width="190" height="190" rx="15" class="panel amber"/><text x="897" y="128" class="head">Resultado</text><text x="890" y="190" class="math">[ I<tspan baseline-shift="sub" font-size="70%">n</tspan> | A<tspan baseline-shift="super" font-size="70%">−1</tspan> ]</text><text x="897" y="238" class="small">Q = A<tspan baseline-shift="super" font-size="70%">−1</tspan></text>
<rect x="85" y="330" width="930" height="90" rx="13" class="note"/><text x="110" y="367" class="body">QA = I<tspan baseline-shift="sub" font-size="70%">n</tspan> y Q invertible  ⇒  A = Q<tspan baseline-shift="super" font-size="70%">−1</tspan>.</text><text x="110" y="400" class="body">Por tanto Q es la inversa bilateral; el bloque derecho se lee como A<tspan baseline-shift="super" font-size="70%">−1</tspan>.</text></svg>