<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="450" viewBox="0 0 1020 450" role="img" aria-labelledby="title desc"><title id="title">Tres intersecciones de rectas</title><desc id="desc">x+y=2 y x-y=0 tienen intersección (1,1); x+y=2 y 2x+2y=4 coinciden; x+y=2 y x+y=4 son paralelas distintas.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="25" y="41.75" fill="#243247" font-size="25">Resolver dos ecuaciones: encontrar su intersección</text><rect x="25" y="70" width="315" height="355" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="41" y="105.95" fill="#243247" font-size="21">Una solución</text><polyline points="70.0,303 278.0,303" fill="none" stroke="#94a3b8" stroke-width="1.5"/><polygon points="278.0,303 267.0,299.0 267.0,307.0" fill="#94a3b8"/><polyline points="90,323.0 90,115.0" fill="none" stroke="#94a3b8" stroke-width="1.5"/><polygon points="90,115.0 86.0,126.0 94.0,126.0" fill="#94a3b8"/><text x="282" y="312.3" fill="#243247" font-size="14">x</text><text x="96" y="124.3" fill="#243247" font-size="14">y</text><text x="71" y="318.35" fill="#243247" font-size="13">0</text><polyline points="70.0,203.0 190.0,323.0" fill="none" stroke="#1d4ed8" stroke-width="4"/><polyline points="70.0,323.0 270.0,123.0" fill="none" stroke="#dc2626" stroke-width="2.5"/><circle cx="130" cy="263" r="4" fill="#111827"/><text x="137" y="258.2" fill="#243247" font-size="16">(1, 1)</text><text x="43" y="366.1" fill="#1d4ed8" font-size="18">x + y = 2</text><text x="43" y="397.1" fill="#dc2626" font-size="18">x − y = 0</text><rect x="360" y="70" width="315" height="355" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="376" y="105.95" fill="#243247" font-size="21">Infinitas soluciones</text><polyline points="405.0,303 613.0,303" fill="none" stroke="#94a3b8" stroke-width="1.5"/><polygon points="613.0,303 602.0,299.0 602.0,307.0" fill="#94a3b8"/><polyline points="425,323.0 425,115.0" fill="none" stroke="#94a3b8" stroke-width="1.5"/><polygon points="425,115.0 421.0,126.0 429.0,126.0" fill="#94a3b8"/><text x="617" y="312.3" fill="#243247" font-size="14">x</text><text x="431" y="124.3" fill="#243247" font-size="14">y</text><text x="406" y="318.35" fill="#243247" font-size="13">0</text><polyline points="405.0,203.0 525.0,323.0" fill="none" stroke="#1d4ed8" stroke-width="4"/><polyline points="405.0,203.0 525.0,323.0" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/><text x="378" y="366.1" fill="#1d4ed8" font-size="18">x + y = 2</text><text x="378" y="397.1" fill="#dc2626" font-size="18">2x + 2y = 4</text><rect x="695" y="70" width="315" height="355" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="711" y="105.95" fill="#243247" font-size="21">Ninguna solución</text><polyline points="740.0,303 948.0,303" fill="none" stroke="#94a3b8" stroke-width="1.5"/><polygon points="948.0,303 937.0,299.0 937.0,307.0" fill="#94a3b8"/><polyline points="760,323.0 760,115.0" fill="none" stroke="#94a3b8" stroke-width="1.5"/><polygon points="760,115.0 756.0,126.0 764.0,126.0" fill="#94a3b8"/><text x="952" y="312.3" fill="#243247" font-size="14">x</text><text x="766" y="124.3" fill="#243247" font-size="14">y</text><text x="741" y="318.35" fill="#243247" font-size="13">0</text><polyline points="740.0,203.0 860.0,323.0" fill="none" stroke="#1d4ed8" stroke-width="4"/><polyline points="740.0,123.0 940.0,323.0" fill="none" stroke="#dc2626" stroke-width="2.5"/><text x="713" y="366.1" fill="#1d4ed8" font-size="18">x + y = 2</text><text x="713" y="397.1" fill="#dc2626" font-size="18">x + y = 4</text></g></svg>