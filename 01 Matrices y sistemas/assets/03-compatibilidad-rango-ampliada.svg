<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">Compatibilidad por comparación de rangos</title><desc id="desc">Dos casos al añadir b como última columna. Si b pertenece al espacio generado por las columnas de A, el rango no cambia y el sistema tiene solución. Si no pertenece, el rango aumenta en uno y la reducción produce una fila 0=c con c distinto de cero.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:18px}.math{font-family:Georgia,serif;font-size:21px}.small{font-size:16px}.panel{fill:#f8fafc;stroke:#64748b;stroke-width:2}.blue{fill:#eff6ff}.teal{fill:#ecfeff}.amber{fill:#fff7ed}.edge{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#arrow)}.divider{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}.note{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5}.bad{fill:#fff1f2;stroke:#e11d48;stroke-width:2}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker></defs><rect width="1100" height="480" fill="#ffffff"/><text x="38" y="48" class="title">Compatibilidad: dos ampliadas, los mismos coeficientes</text>
<rect x="35" y="85" width="500" height="345" rx="16" class="panel blue"/><text x="58" y="120" class="head">Sin pivote en columna ampliada</text>
<path d="M73 145 H68 V199 H73 M204 145 H209 V199 H204" fill="none" stroke="#0f172a" stroke-width="2"/><line x1="159" y1="147" x2="159" y2="197" stroke="#64748b"/><text x="86" y="165" class="math">1</text><text x="123" y="165" class="math">1</text><text x="181" y="165" class="math">2</text><text x="86" y="192" class="math">0</text><text x="123" y="192" class="math">0</text><text x="181" y="192" class="math">0</text><text x="68" y="233" class="body">La ampliada no añade un pivote</text>
<path d="M280 185 L355 185" class="edge"/><text x="340" y="162" class="small">leer</text>
<text x="372" y="175" class="math">rangos iguales</text><text x="68" y="272" class="body">rg(A) = rg([A | b])</text><text x="68" y="316" class="head" fill="#0f766e">Compatible</text><text x="68" y="359" class="small">rg(A) = rg([A|b]) = 1</text>
<line x1="550" y1="85" x2="550" y2="430" class="divider"/>
<rect x="565" y="85" width="500" height="345" rx="16" class="panel amber"/><text x="588" y="120" class="head">Con pivote en columna ampliada</text>
<path d="M603 145 H598 V199 H603 M734 145 H739 V199 H734" fill="none" stroke="#0f172a" stroke-width="2"/><line x1="689" y1="147" x2="689" y2="197" stroke="#64748b"/><text x="616" y="165" class="math">1</text><text x="653" y="165" class="math">1</text><text x="711" y="165" class="math">2</text><text x="616" y="192" class="math">0</text><text x="653" y="192" class="math">0</text><text x="711" y="192" class="math">1</text><text x="598" y="233" class="body">La última fila aporta un pivote</text>
<path d="M805 185 L875 185" class="edge"/><text x="846" y="162" class="small">leer</text>
<rect x="888" y="143" width="150" height="56" rx="9" class="bad"/><text x="900" y="179" class="math">[0  0 | 1]</text><text x="598" y="260" class="body">rg(A) = 1 &lt; rg([A|b]) = 2</text><text x="598" y="308" class="head" fill="#be123c">Incompatible</text><text x="598" y="352" class="math">0 = 1</text><text x="598" y="390" class="small">La última fila es imposible.</text></svg>