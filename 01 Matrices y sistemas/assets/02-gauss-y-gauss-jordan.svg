<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Gauss y Gauss–Jordan: dos puntos de parada</title><desc id="desc">La forma escalonada con filas (1,−1 | 1) y (0,3 | 3) se reduce a (1,0 | 2) y (0,1 | 1), que da la solución x=2, y=1.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker></defs><rect width="1000" height="390" fill="#ffffff"/><text x="40" y="48" class="title">Gauss y Gauss–Jordan: dos puntos de parada</text><rect x="45" y="105" width="370" height="185" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><text x="61" y="133" class="label">GAUSS · REF</text><rect x="585" y="105" width="370" height="185" rx="14" fill="#ecfeff" stroke="#64748b" stroke-width="2"/><text x="601" y="133" class="label">GAUSS–JORDAN · RREF</text><text x="85" y="165" class="body">[ 1  −1 | 1 ]</text><text x="85" y="215" class="body">[ 0   3 | 3 ]</text><text x="625" y="165" class="body">[ 1  0 | 2 ]</text><text x="625" y="215" class="body">[ 0  1 | 1 ]</text><line x1="430" y1="195" x2="565" y2="195" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><text x="497.5" y="183" class="small" text-anchor="middle">normalizar y limpiar arriba</text><text x="55" y="340" class="body">Gauss termina con sustitución; Gauss–Jordan también elimina encima.</text><style>.title{font:700 23px system-ui,sans-serif;fill:#0f172a}.label{font:600 15px system-ui,sans-serif;fill:#334155}.body{font:19px ui-monospace,SFMono-Regular,monospace;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#0f766e}</style></svg>