<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">La matriz elemental actúa por la izquierda</title><desc id="desc">La fila 2 de E, (0, 1, −5), forma en EA la combinación de filas R₂ − 5R₃. La multiplicación se realiza por la izquierda.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker></defs><rect width="1000" height="390" fill="#ffffff"/><text x="40" y="48" class="title">La matriz elemental actúa por la izquierda</text><rect x="45" y="100" width="240" height="180" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><text x="61" y="128" class="label">Fila 2 de E</text><rect x="380" y="100" width="240" height="180" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="396" y="128" class="label">Filas de A</text><rect x="715" y="100" width="240" height="180" rx="14" fill="#ecfeff" stroke="#64748b" stroke-width="2"/><text x="731" y="128" class="label">Fila 2 de EA</text><text x="95" y="175" class="body">(0, 1, −5)</text><text x="430" y="150" class="body">R₁</text><text x="430" y="195" class="body">R₂</text><text x="430" y="240" class="body">R₃</text><text x="760" y="185" class="body">R₂ − 5R₃</text><line x1="295" y1="190" x2="365" y2="190" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><text x="330.0" y="178" class="small" text-anchor="middle">coeficientes</text><line x1="630" y1="190" x2="700" y2="190" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><text x="665.0" y="178" class="small" text-anchor="middle">combina</text><text x="55" y="330" class="body">La fila 2 de E da los coeficientes de R₂ − 5R₃.</text><style>.title{font:700 23px system-ui,sans-serif;fill:#0f172a}.label{font:600 15px system-ui,sans-serif;fill:#334155}.body{font:19px ui-monospace,SFMono-Regular,monospace;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#0f766e}</style></svg>