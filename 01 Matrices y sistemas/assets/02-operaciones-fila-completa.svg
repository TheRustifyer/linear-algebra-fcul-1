<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Una operación modifica la ecuación completa</title><desc id="desc">Multiplicar la fila (2, 1 | 5) por un medio produce (1, 1/2 | 5/2). Cambian tanto los coeficientes como el término independiente.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker></defs><rect width="1000" height="390" fill="#ffffff"/><text x="40" y="48" class="title">Una operación modifica la ecuación completa</text><rect x="55" y="95" width="340" height="190" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><text x="71" y="123" class="label">Matriz inicial</text><rect x="605" y="95" width="340" height="190" rx="14" fill="#ecfeff" stroke="#64748b" stroke-width="2"/><text x="621" y="123" class="label">Tras R₁ ← ½R₁</text><text x="95" y="155" class="body">[ 2     1 | 5 ]</text><text x="95" y="215" class="body">2x + y = 5</text><text x="645" y="155" class="body">[ 1   1/2 | 5/2 ]</text><text x="645" y="215" class="body">x + ½y = 5/2</text><line x1="420" y1="190" x2="565" y2="190" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><text x="492.5" y="178" class="small" text-anchor="middle">multiplicar la fila entera</text><text x="55" y="330" class="body">El término independiente cambia junto con la fila.</text><style>.title{font:700 23px system-ui,sans-serif;fill:#0f172a}.label{font:600 15px system-ui,sans-serif;fill:#334155}.body{font:19px ui-monospace,SFMono-Regular,monospace;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#0f766e}</style></svg>