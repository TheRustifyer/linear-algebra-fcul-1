name: Publish multilingual notes with Argos

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retranslate:
        description: Rebuild all translations with the pinned Argos models
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  translate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      ALGA_SITE_CACHE: /tmp/alga-site-cache
      ARGOS_PACKAGES_DIR: /tmp/alga-site-cache/argos-packages
      XDG_CACHE_HOME: /tmp/alga-site-cache/argos-runtime
      ARGOS_CHUNK_TYPE: MINISBD
      ARGOS_DEVICE_TYPE: cpu
      ARGOS_INTER_THREADS: '1'
      ARGOS_INTRA_THREADS: '2'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      ALGA_RETRANSLATE: ${{ inputs.retranslate || 'false' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .site/i18n/requirements.txt
      - uses: actions/cache/restore@v5
        id: models
        with:
          path: |
            /tmp/alga-site-cache/argos-models
            /tmp/alga-site-cache/argos-packages
            /tmp/alga-site-cache/argos-runtime
          key: ${{ runner.os }}-argos-models-v1-${{ hashFiles('.site/i18n/argos-models.lock.json', '.site/i18n/requirements.txt') }}
          restore-keys: ${{ runner.os }}-argos-models-v1-
      - name: Install publication tools
        run: npm ci --ignore-scripts
      - name: Prepare original notes outside the checkout
        run: npm run site:prepare
      - name: Restore durable translation memory
        id: memory_restore
        run: node .site/i18n/memory-store.mjs pull
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract translatable prose
        id: extract
        run: npm run i18n:extract
      - name: Install Argos with CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r .site/i18n/requirements.txt
      - name: Translate changed fragments with Argos
        id: translate
        run: python .site/i18n/argos.py --cache "$ALGA_SITE_CACHE" --config .site/i18n
      - name: Retain installed models even if translation fails
        if: ${{ always() && steps.models.outputs.cache-hit != 'true' && steps.translate.outcome != 'skipped' }}
        uses: actions/cache/save@v5
        with:
          path: |
            /tmp/alga-site-cache/argos-models
            /tmp/alga-site-cache/argos-packages
            /tmp/alga-site-cache/argos-runtime
          key: ${{ steps.models.outputs.cache-primary-key }}
      - name: Assemble the three editions
        run: npm run i18n:materialize
      - name: Preserve completed translations in the technical branch
        if: ${{ always() && steps.memory_restore.outcome == 'success' && steps.extract.outcome == 'success' }}
        run: node .site/i18n/memory-store.mjs push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Archive translated documents and memory
        if: ${{ always() && steps.extract.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: argos-translations-${{ github.run_id }}
          path: |
            /tmp/alga-site-cache/editions
            /tmp/alga-site-cache/translation-memory
            /tmp/alga-site-cache/translation-stats.json
            /tmp/alga-site-cache/translation-plan.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error
      - name: Translation summary
        if: ${{ always() && steps.extract.outcome == 'success' }}
        run: node .site/i18n/summary.mjs

  build:
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALGA_SITE_CACHE: /tmp/alga-site-cache
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Download prepared editions
        uses: actions/download-artifact@v4
        with:
          name: argos-translations-${{ github.run_id }}
          path: /tmp/alga-site-cache
      - uses: actions/cache@v5
        with:
          path: /tmp/alga-site-cache/engine
          key: ${{ runner.os }}-quartz-${{ hashFiles('.site/quartz-revision.txt') }}
      - name: Build English, Spanish, and Portuguese sites
        run: npm run build:multilingual
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
