<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" viewBox="0 0 1040 310" role="img" aria-labelledby="title desc"><title id="title">Dependencias de las propiedades vectoriales</title><desc id="desc">Los axiomas aditivos permiten probar cancelación. Con distributividad se obtienen reglas del cero; luego signos y producto nulo.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="38.75" fill="#243247" font-size="25">Qué resultados necesita cada demostración</text><rect x="20" y="92" width="233" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="32" y="125.1" fill="#243247" font-size="18">Axiomas aditivos</text><text x="32" y="173.25" fill="#243247" font-size="15">Neutro y opuestos</text><rect x="275" y="92" width="233" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="287" y="125.1" fill="#243247" font-size="18">Cancelación</text><text x="287" y="173.25" fill="#243247" font-size="15">Sólo usa la suma</text><rect x="530" y="92" width="233" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="542" y="125.1" fill="#243247" font-size="18">Reglas del cero</text><text x="542" y="173.25" fill="#243247" font-size="15">Añadir distributividad</text><rect x="785" y="92" width="233" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="797" y="125.1" fill="#243247" font-size="18">Signos y producto nulo</text><text x="797" y="173.25" fill="#243247" font-size="15">Unicidad / inverso escalar</text><polyline points="253,164 272,164" fill="none" stroke="#1d4ed8" stroke-width="2"/><polygon points="272,164 261.0,160.0 261.0,168.0" fill="#1d4ed8"/><polyline points="508,164 527,164" fill="none" stroke="#1d4ed8" stroke-width="2"/><polygon points="527,164 516.0,160.0 516.0,168.0" fill="#1d4ed8"/><polyline points="763,164 782,164" fill="none" stroke="#1d4ed8" stroke-width="2"/><polygon points="782,164 771.0,160.0 771.0,168.0" fill="#1d4ed8"/><text x="26" y="283.05" fill="#243247" font-size="19">Una prueba de cancelación no necesita suponer 0_K v = 0_V.</text></g></svg>