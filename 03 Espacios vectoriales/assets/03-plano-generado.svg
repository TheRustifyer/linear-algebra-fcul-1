<svg xmlns="http://www.w3.org/2000/svg" width="910" height="470" viewBox="0 0 910 470" role="img" aria-labelledby="title desc"><title id="title">Dos generadores de z=x+y</title><desc id="desc">Plano generado por u=(1,0,1) y v=(0,1,1), y su suma (1,1,2). Proyección oblicua sin escala espacial.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="38.75" fill="#243247" font-size="25">z = x + y: dos parámetros, dos generadores</text><polyline points="339.25,417.2 505.75,284.0 607.5,62.0 441.0,195.2 339.25,417.2" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><polyline points="390,350 606.0,393.2" fill="none" stroke="#94a3b8" stroke-width="1.5"/><polygon points="606.0,393.2 595.9980771079527,387.1203998107163 594.4291480268471,394.96504521624365" fill="#94a3b8"/><text x="612.0" y="408.4" fill="#243247" font-size="16">x</text><polyline points="390,350 544.0,266.0" fill="none" stroke="#94a3b8" stroke-width="1.5"/><polygon points="544.0,266.0 532.4277401752195,267.75579114582877 536.258557220664,274.77895572914383" fill="#94a3b8"/><text x="550.0" y="281.2" fill="#243247" font-size="16">y</text><polyline points="390,350 390,80" fill="none" stroke="#94a3b8" stroke-width="1.5"/><polygon points="390,80 386.0,91.0 394.0,91.0" fill="#94a3b8"/><text x="396" y="95.2" fill="#243247" font-size="16">z</text><polyline points="390,350 480,278" fill="none" stroke="#1d4ed8" stroke-width="3"/><polygon points="480,278 468.91166290590894,281.7481702853265 473.90922328634434,287.9951207608708" fill="#1d4ed8"/><polyline points="390,350 445,230" fill="none" stroke="#dc2626" stroke-width="3"/><polygon points="445,230 436.7805388929975,238.33309420986427 444.05305747615176,241.66633189380997" fill="#dc2626"/><polyline points="480,278 535,158 445,230" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/><polyline points="390,350 535,158" fill="none" stroke="#7c3aed" stroke-width="3"/><polygon points="535,158 525.1787741574227,164.36737959831925 531.562778767748,169.18863308007536" fill="#7c3aed"/><text x="492" y="299.1" fill="#1d4ed8" font-size="18">u = (1, 0, 1)</text><text x="225" y="228.1" fill="#dc2626" font-size="18">v = (0, 1, 1)</text><text x="560" y="167.05" fill="#7c3aed" font-size="19">u + v = (1, 1, 2)</text><text x="25" y="437.0" fill="#243247" font-size="20">Cada punto del plano es (α, β, α + β) = αu + βv.</text></g></svg>