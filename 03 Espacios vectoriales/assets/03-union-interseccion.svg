<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">La unión de planos no conserva la suma</title><desc id="desc">Planos W1:y=0 y W2:z=0; intersección eje x. u=(1,0,1), v=(1,1,0), u+v=(2,1,1) fuera de ambos.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="38.75" fill="#243247" font-size="25">Intersección y unión de dos planos</text><polyline points="197,355 577,415 730.6,319.0 350.6,259.0 197,355" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><polyline points="245,375.0 625,435.0 625,185 245,125 245,375.0" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><polyline points="245,325 653.5,389.5" fill="none" stroke="#059669" stroke-width="4"/><polygon points="653.5,389.5 643.2584576752722,383.8333598304806 642.0107570874882,391.73546355311316" fill="#059669"/><polyline points="340,340 435,255" fill="none" stroke="#1d4ed8" stroke-width="3"/><polygon points="435,255 424.13516611334455,259.35377820006767 429.4695249891032,265.31570870826846" fill="#1d4ed8"/><polyline points="340,340 483,325" fill="none" stroke="#dc2626" stroke-width="3"/><polygon points="483,325 471.6427305690516,322.16937620428905 472.477312523561,330.12572417061176" fill="#dc2626"/><polyline points="435,255 578,240 483,325" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/><polyline points="340,340 578,240" fill="none" stroke="#7c3aed" stroke-width="3"/><polygon points="578,240 566.3093486814632,240.573299004355 569.4082622185174,247.9487132225439" fill="#7c3aed"/><text x="240" y="91.0" fill="#1d4ed8" font-size="20">W₁: y = 0</text><text x="690" y="319.0" fill="#243247" font-size="20">W₂: z = 0</text><text x="365" y="219.1" fill="#1d4ed8" font-size="18">u = (1, 0, 1)</text><text x="470" y="361.1" fill="#dc2626" font-size="18">v = (1, 1, 0)</text><text x="590" y="206.1" fill="#7c3aed" font-size="18">u + v = (2, 1, 1)</text><text x="580" y="432.05" fill="#059669" font-size="19">W₁ ∩ W₂: eje x</text><text x="660" y="256.15" fill="#7c3aed" font-size="17">En la suma:</text><text x="660" y="277.4" fill="#7c3aed" font-size="17">y = 1 ≠ 0</text><text x="660" y="298.65" fill="#7c3aed" font-size="17">z = 1 ≠ 0</text><text x="24" y="461.1" fill="#243247" font-size="18">Proyección oblicua sin escala espacial. La suma no cumple y = 0 ni z = 0.</text></g></svg>