<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Dos bases para el mismo vector</title><desc id="desc">v=(3,1)=2c1+c2, c1=(1,1), c2=(1,−1). Paralelogramo con origen, 2c1=(2,2), c2=(1,−1) y v=(3,1).</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="38.75" fill="#243247" font-size="25">v = 2c₁ + c₂ = (3, 1)</text><polyline points="97.0,305 520.0,305" fill="none" stroke="#64748b" stroke-width="1.5"/><polygon points="520.0,305 509.0,301.0 509.0,309.0" fill="#64748b"/><polyline points="160,426.5 160,66.5" fill="none" stroke="#64748b" stroke-width="1.5"/><polygon points="160,66.5 156.0,77.5 164.0,77.5" fill="#64748b"/><text x="505.0" y="330.2" fill="#243247" font-size="16">x</text><text x="170" y="79.7" fill="#243247" font-size="16">y</text><polyline points="160,305 340,125 430,215 250,395 160,305" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/><polyline points="160,305 250,215" fill="none" stroke="#1d4ed8" stroke-width="3"/><polygon points="250,215 239.3933982822018,219.94974746830584 245.05025253169416,225.6066017177982" fill="#1d4ed8"/><text x="240" y="204.05" fill="#1d4ed8" font-size="19">c₁ = (1, 1)</text><polyline points="160,305 340,125" fill="none" stroke="#1d4ed8" stroke-width="3"/><polygon points="340,125 329.39339828220176,129.94974746830584 335.0502525316942,135.6066017177982" fill="#1d4ed8"/><text x="352" y="133.05" fill="#1d4ed8" font-size="19">2c₁</text><polyline points="160,305 250,395" fill="none" stroke="#dc2626" stroke-width="3"/><polygon points="250,395 245.05025253169416,384.39339828220176 239.3933982822018,390.0502525316942" fill="#dc2626"/><text x="260" y="417.05" fill="#dc2626" font-size="19">c₂ = (1, −1)</text><polyline points="160,305 430,215" fill="none" stroke="#7c3aed" stroke-width="3"/><polygon points="430,215 418.299572657377,214.68377223398318 420.8293947855117,222.27323861838727" fill="#7c3aed"/><text x="445" y="225.05" fill="#7c3aed" font-size="19">v = (3, 1)</text><rect x="610" y="120" width="260" height="185" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="630" y="157.1" fill="#243247" font-size="18">En la base canónica:</text><text x="630" y="194.85" fill="#243247" font-size="23">[v]E = (3, 1)ᵀ</text><text x="630" y="242.1" fill="#243247" font-size="18">En C = (c₁, c₂):</text><text x="630" y="280.85" fill="#243247" font-size="23">[v]C = (2, 1)ᵀ</text><text x="25" y="439.05" fill="#243247" font-size="19">Los coeficientes cambian; el vector reconstruido llega al mismo extremo.</text></g></svg>