<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Plano y recta suplementarios</title><desc id="desc">R3 es suma directa del plano z=0 y el eje z; (2,1,2)=(2,1,0)+(0,0,2).</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="38.75" fill="#243247" font-size="25">R³ = {z = 0} ⊕ eje z</text><polyline points="165,343 525,403 669.0,313.4 309.0,253.39999999999998 165,343" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><polyline points="300,375.0 300,78.00000000000003" fill="none" stroke="#dc2626" stroke-width="2"/><polygon points="300,78.00000000000003 296.0,89.00000000000003 304.0,89.00000000000003" fill="#dc2626"/><polyline points="300,330 525,332" fill="none" stroke="#1d4ed8" stroke-width="3"/><polygon points="525,332 514.0359886931257,327.90238410014666 513.9648803911758,335.9020680694916" fill="#1d4ed8"/><polyline points="525,332 525,152 300,150" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/><polyline points="300,330 300,150" fill="none" stroke="#dc2626" stroke-width="3"/><polygon points="300,150 296.0,161.0 304.0,161.0" fill="#dc2626"/><polyline points="300,330 525,152" fill="none" stroke="#7c3aed" stroke-width="3"/><polygon points="525,152 513.8914237395314,155.68775452889102 518.854904315279,161.96181705441447" fill="#7c3aed"/><text x="480" y="363.0" fill="#1d4ed8" font-size="20">u = (2, 1, 0)</text><text x="118" y="146.05" fill="#dc2626" font-size="19">w = (0, 0, 2)</text><text x="550" y="159.0" fill="#7c3aed" font-size="20">u + w = (2, 1, 2)</text><text x="640" y="339.95" fill="#1d4ed8" font-size="21">U: z = 0</text><text x="320" y="77.05" fill="#dc2626" font-size="19">W: eje z</text><text x="24" y="441.05" fill="#243247" font-size="19">Proyección oblicua sin escala espacial. U ∩ W = {0}.</text></g></svg>