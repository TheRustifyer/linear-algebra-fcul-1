<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="360" viewBox="0 0 1050 360" role="img" aria-labelledby="title desc"><title id="title">Efecto de tres operaciones elementales</title><desc id="desc">Matriz inicial [[3,2],[4,5]], determinante 7. Intercambio produce −7, escalar fila por3 produce21, reemplazo por múltiplo conserva7.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="22" y="39.8" fill="#243247" font-size="24">Misma matriz inicial: A = ((3, 2), (4, 5)),   det(A) = 7</text><rect x="20" y="79" width="326" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="37" y="115.95" fill="#243247" font-size="21">Intercambio</text><text x="37" y="156.0" fill="#1d4ed8" font-size="20">L₁ ↔ L₂</text><text x="105" y="206.95" fill="#243247" font-size="21">4</text><text x="148" y="206.95" fill="#243247" font-size="21">5</text><text x="105" y="249.95" fill="#243247" font-size="21">3</text><text x="148" y="249.95" fill="#243247" font-size="21">2</text><polyline points="94,180 87,180 87,267 94,267" fill="none" stroke="#243247" stroke-width="2"/><polyline points="183,180 191,180 191,267 183,267" fill="none" stroke="#243247" stroke-width="2"/><text x="198" y="226.95" fill="#243247" font-size="21">det = −7</text><rect x="364" y="79" width="326" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="381" y="115.95" fill="#243247" font-size="21">Escalado de una fila</text><text x="381" y="156.0" fill="#1d4ed8" font-size="20">L₁ ← 3L₁</text><text x="449" y="206.95" fill="#243247" font-size="21">9</text><text x="492" y="206.95" fill="#243247" font-size="21">6</text><text x="449" y="249.95" fill="#243247" font-size="21">4</text><text x="492" y="249.95" fill="#243247" font-size="21">5</text><polyline points="438,180 431,180 431,267 438,267" fill="none" stroke="#243247" stroke-width="2"/><polyline points="527,180 535,180 535,267 527,267" fill="none" stroke="#243247" stroke-width="2"/><text x="542" y="226.95" fill="#243247" font-size="21">det = 21</text><rect x="708" y="79" width="326" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="725" y="115.95" fill="#243247" font-size="21">Reemplazo</text><text x="725" y="156.0" fill="#1d4ed8" font-size="20">L₂ ← L₂ + 2L₁</text><text x="793" y="206.95" fill="#243247" font-size="21">3</text><text x="836" y="206.95" fill="#243247" font-size="21">2</text><text x="793" y="249.95" fill="#243247" font-size="21">10</text><text x="836" y="249.95" fill="#243247" font-size="21">9</text><polyline points="782,180 775,180 775,267 782,267" fill="none" stroke="#243247" stroke-width="2"/><polyline points="871,180 879,180 879,267 871,267" fill="none" stroke="#243247" stroke-width="2"/><text x="886" y="226.95" fill="#243247" font-size="21">det = 7</text></g></svg>